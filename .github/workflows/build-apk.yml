name: Build Android APK

on:
  push:
    branches: [ "claude/*", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.1.10909125"
          sdkmanager --install "cmake;3.22.1"

      - name: Download whisper.cpp
        run: |
          WHISPER_DIR="app/src/main/cpp/whisper.cpp"
          git clone --depth 1 --branch v1.7.3 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_DIR"
          rm -rf "$WHISPER_DIR/.git"

      - name: Configure Android SDK for Gradle
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin
        id: kotlin_build
        continue-on-error: true
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee kotlin-build.log

      - name: Report Kotlin errors
        if: steps.kotlin_build.outcome == 'failure'
        run: |
          echo "## Kotlin Compilation Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 kotlin-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== LAST 200 LINES ==="
          tail -200 kotlin-build.log
          exit 1

      - name: Build Native Code
        id: native_build
        continue-on-error: true
        run: ./gradlew externalNativeBuildDebug --no-daemon --stacktrace 2>&1 | tee native-build.log

      - name: Report Native errors
        if: steps.native_build.outcome == 'failure'
        run: |
          echo "## Native Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 native-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== LAST 200 LINES ==="
          tail -200 native-build.log
          exit 1

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoiceNotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            kotlin-build.log
            native-build.log
          retention-days: 7
