name: Build Android APK

on:
  push:
    branches: [ "claude/*", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.1.10909125"
          sdkmanager --install "cmake;3.22.1"

      - name: Download whisper.cpp
        run: |
          WHISPER_DIR="app/src/main/cpp/whisper.cpp"
          git clone --depth 1 --branch v1.7.3 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_DIR"
          rm -rf "$WHISPER_DIR/.git"
          echo "=== Verify source files exist ==="
          for f in ggml/src/ggml.c ggml/src/ggml-backend.cpp ggml/src/ggml-cpu/ggml-cpu.c ggml/src/ggml-cpu/llamafile/sgemm.cpp include/whisper.h src/whisper.cpp; do
            if [ -f "$WHISPER_DIR/$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Configure Android SDK for Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "============================================"
            echo "BUILD FAILED - Last 300 lines of build log:"
            echo "============================================"
            tail -300 build.log
            exit $BUILD_EXIT
          fi

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoiceNotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
