name: Build Android APK

on:
  push:
    branches: [ "claude/*", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.1.10909125"
          sdkmanager --install "cmake;3.22.1"

      - name: Download whisper.cpp
        run: |
          WHISPER_DIR="app/src/main/cpp/whisper.cpp"
          git clone --depth 1 --branch v1.7.3 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_DIR"
          rm -rf "$WHISPER_DIR/.git"

      - name: Configure Android SDK for Gradle
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
        continue-on-error: true

      - name: List APK outputs
        if: always()
        run: |
          echo "=== Debug APKs ==="
          find app/build/outputs/ -name "*.apk" -ls 2>/dev/null || echo "No APKs found"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VoiceNotes-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
          retention-days: 7
